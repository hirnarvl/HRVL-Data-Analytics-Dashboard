<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  
  <!-- Outer Ring / Shield Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#emeraldGrad)" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="190" fill="#0f172a" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>

  <!-- Pulse EKG wave in background -->
  <path d="M 120 256 L 190 256 L 210 200 L 235 310 L 265 170 L 290 320 L 315 230 L 335 270 L 350 256 L 392 256" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

  <!-- Core Lab Flask / Veterinary Emblem -->
  <g transform="translate(256, 250) scale(1.15)">
    <!-- Flask Outline -->
    <path d="M -24 -90 L 24 -90 M -16 -90 L -16 -40 L -65 50 C -75 68 -60 85 -40 85 L 40 85 C 60 85 75 68 65 50 L 16 -40 L 16 -90" fill="#1e293b" stroke="url(#blueGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Liquid in Flask -->
    <path d="M -50 26 L -35 5 C -20 12 0 -5 20 8 L 50 26 C 58 40 54 75 35 77 L -35 77 C -54 75 -58 40 -50 26 Z" fill="url(#emeraldGrad)" opacity="0.85"/>
    <!-- Bubbles -->
    <circle cx="-12" cy="45" r="5" fill="#ffffff" opacity="0.6"/>
    <circle cx="15" cy="30" r="7" fill="#ffffff" opacity="0.7"/>
    <circle cx="-5" cy="15" r="4" fill="#ffffff" opacity="0.5"/>
    <!-- Veterinary Rod of Asclepius / Cross Symbol -->
    <path d="M 0 -15 L 0 55 M -15 20 L 15 20" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Typography / Brand Tag -->
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#f8fafc" letter-spacing="4">HRVL • ADNIS</text>
  <text x="256" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#10b981" letter-spacing="2">EPI-SURVEILLANCE</text>
</svg>
